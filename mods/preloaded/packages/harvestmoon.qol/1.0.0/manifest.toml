format_version = 1
id = "harvestmoon.qol"
version = "1.0.0"
name = "Quality of life"
author = "HarvestMoonSNESRecomp"
description = "Comfort improvements that do not change the game: faster text, longer days, a pause menu and widescreen."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

# Text here is English; translations live in src/hm_i18n.c and follow the
# language picked in the launcher.

[[target]]
game_id = "harvestmoon-usa"
rom_sha256 = "73a3aa87ddd5ce5df5ba51292316f42b6e128280179b0a1b11b4dcddc17d4163"

[[feature]]
id = "fast_text"
name = "Fast text"
description = "Dialogue is written 4 times faster, as if you held A all the time."
group = "Quality of life"
default_enabled = false

[[plugin]]
feature = "fast_text"
id = "harvestmoon.qol.fast_text"

[[feature]]
id = "day_length"
name = "Longer days"
description = "The game clock runs slower. Normally a day (6:00 to 18:00) lasts 3 real minutes."
group = "Quality of life"
default_enabled = false

[[plugin]]
feature = "day_length"
id = "harvestmoon.qol.day_length"

[[option]]
feature = "day_length"
id = "factor"
label = "Day length"
type = "choice"
default = "2"

[[option.choice]]
value = "1.5"
label = "1.5x (4.5 minutes)"

[[option.choice]]
value = "2"
label = "2x (6 minutes)"

[[option.choice]]
value = "3"
label = "3x (9 minutes)"

[[option.choice]]
value = "4"
label = "4x (12 minutes)"

[[feature]]
id = "pause_menu"
name = "Pause menu (Harvest Moon 64 style)"
description = "M key or right-stick click (R3): tools, the girls' hearts and your farm's status. The game is paused while it is open."
group = "Quality of life"
default_enabled = true

[[plugin]]
feature = "pause_menu"
id = "harvestmoon.qol.pause_menu"

[[feature]]
id = "title_options"
name = "OPTIONS on the title screen"
description = "Adds a fourth entry, OPTIONS, below HOW TO PLAY, which opens this options menu."
group = "Quality of life"
default_enabled = true

[[plugin]]
feature = "title_options"
id = "harvestmoon.qol.title_options"

[[feature]]
id = "endless"
name = "Endless game"
description = "The game no longer stops after Year 3: you watch the ending, then wake up on Summer 30 and keep farming through Year 4, 5 and beyond."
group = "Quality of life"
default_enabled = true

[[plugin]]
feature = "endless"
id = "harvestmoon.qol.endless"

[[feature]]
id = "widescreen"
name = "Widescreen (16:9)"
description = "Shows more of the map at the sides instead of black bars; the Natsume logo, the intro, the title screen and the diary selection fill the screen too. At a map's edge and in small rooms it looks like the original (4:3)."
group = "Video"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "harvestmoon.qol.widescreen"

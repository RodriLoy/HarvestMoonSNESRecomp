format_version = 1
id = "harvestmoon.cheats"
version = "1.0.0"
name = "Cheats"
author = "HarvestMoonSNESRecomp"
description = "Classic cheats. They only act while a diary is loaded and stay inside the game's own limits, so your saves remain valid when you turn them off."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

# Text here is English; translations live in src/hm_i18n.c and follow the
# language picked in the launcher.

[[target]]
game_id = "harvestmoon-usa"
rom_sha256 = "73a3aa87ddd5ce5df5ba51292316f42b6e128280179b0a1b11b4dcddc17d4163"

[[feature]]
id = "money"
name = "Infinite money"
description = "Keeps your money at the most the game allows: 9,999,990 G."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "money"
id = "harvestmoon.cheat.money"

[[feature]]
id = "stamina"
name = "Infinite stamina"
description = "Your stamina is always topped up: you never get tired."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "stamina"
id = "harvestmoon.cheat.stamina"

[[feature]]
id = "freeze_clock"
name = "Stop the clock"
description = "Time does not pass during the day. Going to bed still moves on to the next day."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "freeze_clock"
id = "harvestmoon.cheat.freeze_clock"

[[feature]]
id = "stock"
name = "Infinite lumber and fodder"
description = "Keeps the lumber and the fodder in the silo at 999 (the game's maximum)."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "stock"
id = "harvestmoon.cheat.stock"

[[feature]]
id = "bags"
name = "Infinite seeds and feed"
description = "Seed and feed bags you already have are refilled to 99."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "bags"
id = "harvestmoon.cheat.bags"

[[feature]]
id = "weather"
name = "Control the weather"
description = "Choose the weather of ordinary days. Festivals are left alone."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "weather"
id = "harvestmoon.cheat.weather"

[[option]]
feature = "weather"
id = "mode"
label = "Weather"
type = "choice"
default = "sunny"

[[option.choice]]
value = "sunny"
label = "Always sunny"

[[option.choice]]
value = "rain"
label = "Always rain (waters your crops; snow in winter)"

[[option.choice]]
value = "no_storms"
label = "No hurricanes or storms"
